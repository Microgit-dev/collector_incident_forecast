global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9101"]

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: caddy
    static_configs:
      - targets: ["web:2019"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
