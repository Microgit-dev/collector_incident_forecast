global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Правила оповещений: страница «Alerts» в Prometheus и панель «Оповещения» в Grafana
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9101"]
        labels: {contour: combat}

  # Учебный контур (профиль training): поток симулятора. Контур не поднят — цель просто «down»
  - job_name: consumer-training
    static_configs:
      - targets: ["consumer-training:9102"]
        labels: {contour: training}

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: caddy
    static_configs:
      - targets: ["web:2019"]

  - job_name: prometheus
    # веб-интерфейс опубликован под /prometheus/ (--web.external-url), метрики — там же
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]
