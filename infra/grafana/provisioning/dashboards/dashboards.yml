apiVersion: 1

# Две папки с разными правами (выставляет manage.py grafana_setup):
#   «Аналитика» — бизнес-панели по витринам, видят аналитик и администратор;
#   «Система»   — состояние сервисов и очередей, только администратор.
providers:
  - name: analytics
    folder: Аналитика
    folderUid: analytics
    type: file
    disableDeletion: true
    options:
      path: /var/lib/grafana/dashboards/analytics
  - name: system
    folder: Система
    folderUid: system
    type: file
    disableDeletion: true
    options:
      path: /var/lib/grafana/dashboards/system
