apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Прямой доступ к витринам TimescaleDB — для бизнес-дашбордов (инциденты, телеметрия)
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: $POSTGRES_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
