# Полный стенд одной командой:  docker compose up -d --build
# Демо-поток СМВУ:              docker compose --profile demo up -d replay
# Учебный контур и симулятор:   docker compose --profile training up -d --build
#                               (https://localhost:8443 · симулятор http://localhost:8095)
# Интерфейс: https://localhost  · API: /api/docs/ · Админка: /admin/ · Grafana: /grafana/

# Образ собирает только сервис migrate; остальные backend-сервисы переиспользуют его
x-backend: &backend
  image: collector-forecast/backend:local
  pull_policy: never
  env_file: .env
  environment:
    DATA_DIR: /data
    ARTIFACTS_DIR: /artifacts
    # Меньше потоков — меньше пиковая память пакетного импорта при почти той же скорости
    POLARS_MAX_THREADS: "4"
  volumes:
    - ./data:/data:ro
    - ./artifacts:/artifacts
    - media:/app/media
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

# Учебный контур: тот же образ, но своя база, тема Kafka, Redis-индекс и help desk; вместо справочников
# заказчика смонтирован полигон. Пересечься с боевым контуром ему негде.
x-training: &training
  image: collector-forecast/backend:local
  pull_policy: never
  profiles: ["training"]
  env_file: .env
  environment: &training-env
    CONTOUR: training
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_training
    REDIS_URL: redis://redis:6379/1
    KAFKA_TOPIC_RAW_EVENTS: smvu.training-events
    KAFKA_CONSUMER_GROUP: collector-training
    HELPDESK_URL: http://mock-helpdesk-training:8080
    CSRF_TRUSTED_ORIGINS: https://localhost:8443
    DATA_DIR: /data
    ARTIFACTS_DIR: /artifacts
  volumes:
    - ./simulator/polygon:/data:ro
    - trainingartifacts:/artifacts
    - trainingmedia:/app/media
  restart: unless-stopped
  depends_on:
    migrate-training:
      condition: service_completed_successfully

services:
  # ---------- хранилища и брокеры ----------
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    # Брокер — единственная точка, общая с полевым контуром (сеть field), как у настоящей СМВУ
    networks: [default, field]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      # Однонодовому брокеру стенда хватает 512 МБ кучи; по умолчанию JVM берёт больше
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  openldap:
    # Тестовый каталог вместо AD заказчика: учётки и группы-роли из infra/ldap/bootstrap.ldif
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Collector Forecast
      LDAP_DOMAIN: collector.local
      LDAP_ADMIN_PASSWORD: ${LDAP_BIND_PASSWORD}
    volumes:
      - ./infra/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
    restart: unless-stopped

  # ---------- приложение ----------
  migrate:
    build: ./backend
    image: collector-forecast/backend:local
    env_file: .env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap"]
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    # Несколько процессов uvicorn: sync-вьюхи DRF не блокируют друг друга;
    # метрики процессов собираются через PROMETHEUS_MULTIPROC_DIR
    command: >
      sh -c "rm -rf /tmp/prometheus/* && uvicorn config.asgi:application --host 0.0.0.0 --port 8000
      --workers 4 --proxy-headers --forwarded-allow-ips '*'"
    environment:
      DATA_DIR: /data
      ARTIFACTS_DIR: /artifacts
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  consumer:
    <<: *backend
    command: ["python", "manage.py", "consume_events"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  replay:
    # Эмулятор потока СМВУ из реального журнала (профиль demo)
    <<: *backend
    profiles: ["demo"]
    command: ["python", "manage.py", "replay_journal", "/data/dataset/журнал_событий_пример.csv", "--speed", "${REPLAY_SPEED:-60}"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  # Эмулятор системы учёта заявок заказчика (help desk): жизненный цикл заявок, страница /helpdesk/
  mock-helpdesk:
    build: ./infra/mock-helpdesk
    image: collector-forecast/mock-helpdesk:local
    environment:
      STAGE_MINUTES: ${HELPDESK_STAGE_MINUTES:-2,5,20,10}
    volumes:
      - helpdeskdata:/data
    restart: unless-stopped

  # ---------- учебный контур (профиль training) ----------
  migrate-training:
    <<: *training
    command: ["sh", "-c", "python manage.py ensure_database && python manage.py migrate --noinput && python manage.py bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend-training:
    <<: *training
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-training:
    # Воркер и планировщик в одном процессе: нагрузка учебного контура невелика
    <<: *training
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]

  consumer-training:
    <<: *training
    command: ["python", "manage.py", "consume_events", "--metrics-port", "9102"]
    depends_on:
      migrate-training:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  mock-helpdesk-training:
    image: collector-forecast/mock-helpdesk:local
    pull_policy: never
    profiles: ["training"]
    environment:
      STAGE_MINUTES: ${HELPDESK_STAGE_MINUTES:-2,5,20,10}
    volumes:
      - helpdeskdata-training:/data
    restart: unless-stopped

  # Симулятор датчиков: полевой контур, видит только Kafka; веб-интерфейс — только с этой машины
  simulator:
    build: ./simulator
    image: collector-forecast/simulator:local
    profiles: ["training"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${SIMULATOR_TOPIC:-smvu.training-events}
      SIM_CONTOUR: ${SIMULATOR_CONTOUR:-учебный контур}
      # Команды учебных заданий (восстановить объект, запустить сценарий) — через тот же брокер
      SIM_COMMANDS_TOPIC: sim.training-commands
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8095}:8095"
    networks: [field]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Caddy: TLS (самоподписанный локальный CA), SPA и reverse proxy к API/WS/Grafana
    build: ./frontend
    image: collector-forecast/web:local
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAINING_PORT:-8443}:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------- наблюдаемость ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on: [db]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]
    restart: unless-stopped

  celery-exporter:
    image: danihodovic/celery-exporter:0.12.2
    command: ["--broker-url=redis://redis:6379/0"]
    depends_on: [redis]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m"
    # Kafka UI без входа читает и пишет в темы (можно подмешать события датчиков) — только с этой машины;
    # удалённо — через SSH-туннель
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- надёжность ----------
  backup:
    # Автоматическое резервное копирование (ТЗ §11): ежедневный pg_dump с ротацией
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      POSTGRES_EXTRA_OPTS: "-Z6 --no-owner"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Полевой контур: симулятор и (в эксплуатации) шлюз СМВУ; из платформы сюда виден только брокер
  field:

volumes:
  pgdata:
  helpdeskdata:
  helpdeskdata-training:
  trainingartifacts:
  trainingmedia:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
  caddydata:
  media:
