# Полный стенд одной командой:  docker compose up -d --build
# Демо-поток СМВУ:              docker compose --profile demo up -d replay
# ИИ-выделение зданий по снимку: docker compose --profile ai up -d --build segmenter
# Учебный контур и симулятор:   docker compose --profile training up -d --build
#                               (https://localhost/training/ · симулятор http://localhost:8095)
# Интерфейс: https://localhost  · API: /api/docs/ · Админка: /admin/ · Grafana: /grafana/

# Образ собирает только сервис migrate; остальные backend-сервисы переиспользуют его
x-backend: &backend
  image: collector-forecast/backend:local
  pull_policy: never
  env_file: .env
  environment:
    DATA_DIR: /data
    ARTIFACTS_DIR: /artifacts
    # Меньше потоков — меньше пиковая память пакетного импорта при почти той же скорости
    POLARS_MAX_THREADS: "4"
    # Сервис ИИ-выделения зданий (профиль ai); не запущен — контур берётся из OpenStreetMap
    SEGMENTER_URL: ${SEGMENTER_URL:-http://segmenter:8000}
  volumes:
    - ./data:/data:ro
    - ./artifacts:/artifacts
    - media:/app/media
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

# Учебный контур — подсистема платформы на том же адресе (/training/): тот же образ, своя база, тема Kafka,
# Redis-индекс и help desk; вместо справочников заказчика смонтирован полигон. Данные с боевым контуром
# не пересекаются, а вход и учётные записи общие: токен выдаёт основная система, учётки, роли и команды
# читаются из её базы (IDENTITY_DATABASE_URL, apps/accounts/identity.py).
x-training: &training
  image: collector-forecast/backend:local
  pull_policy: never
  profiles: ["training"]
  env_file: .env
  environment: &training-env
    CONTOUR: training
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_training
    REDIS_URL: redis://redis:6379/1
    KAFKA_TOPIC_RAW_EVENTS: smvu.training-events
    KAFKA_CONSUMER_GROUP: collector-training
    HELPDESK_URL: http://mock-helpdesk-training:8080
    # кадры камер — тот же эмулятор VMS (он без состояния); страницы просмотра в учебном контуре нет
    VMS_LIVE_URL: ""
    IDENTITY_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    DATA_DIR: /data
    ARTIFACTS_DIR: /artifacts
  volumes:
    - ./simulator/polygon:/data:ro
    - trainingartifacts:/artifacts
    - trainingmedia:/app/media
  restart: unless-stopped
  depends_on:
    migrate-training:
      condition: service_completed_successfully

services:
  # ---------- хранилища и брокеры ----------
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    # Брокер — единственная точка, общая с полевым контуром (сеть field), как у настоящей СМВУ
    networks: [default, field]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      # Однонодовому брокеру стенда хватает 512 МБ кучи; по умолчанию JVM берёт больше
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  openldap:
    # Тестовый каталог вместо AD заказчика: учётки и группы-роли из infra/ldap/bootstrap.ldif
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Collector Forecast
      LDAP_DOMAIN: collector.local
      LDAP_ADMIN_PASSWORD: ${LDAP_BIND_PASSWORD}
    volumes:
      - ./infra/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
    restart: unless-stopped

  # ---------- приложение ----------
  migrate:
    build: ./backend
    image: collector-forecast/backend:local
    env_file: .env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap"]
    environment:
      DATA_DIR: /data
      # роль БД только для чтения для источника данных Grafana (ensure_grafana_reader)
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    # Несколько процессов uvicorn: sync-вьюхи DRF не блокируют друг друга;
    # метрики процессов собираются через PROMETHEUS_MULTIPROC_DIR
    command: >
      sh -c "rm -rf /tmp/prometheus/* && uvicorn config.asgi:application --host 0.0.0.0 --port 8000
      --workers 4 --proxy-headers --forwarded-allow-ips '*'"
    environment:
      DATA_DIR: /data
      ARTIFACTS_DIR: /artifacts
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      SEGMENTER_URL: ${SEGMENTER_URL:-http://segmenter:8000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  consumer:
    <<: *backend
    command: ["python", "manage.py", "consume_events"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  replay:
    # Эмулятор потока СМВУ из реального журнала (профиль demo)
    <<: *backend
    profiles: ["demo"]
    command: ["python", "manage.py", "replay_journal", "/data/dataset/журнал_событий_пример.csv", "--speed", "${REPLAY_SPEED:-60}"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  # Эмулятор системы учёта заявок заказчика (help desk): жизненный цикл заявок, страница /helpdesk/
  mock-helpdesk:
    build: ./infra/mock-helpdesk
    image: collector-forecast/mock-helpdesk:local
    environment:
      STAGE_MINUTES: ${HELPDESK_STAGE_MINUTES:-2,5,20,10}
    volumes:
      - helpdeskdata:/data
    restart: unless-stopped

  # Эмулятор системы видеонаблюдения заказчика (VMS): кадры камер для проверки тревоги, страница /vms/live/
  mock-vms:
    build: ./infra/mock-vms
    image: collector-forecast/mock-vms:local
    restart: unless-stopped

  # ИИ-выделение зданий по спутниковому снимку для редактора объектов (профиль ai): Segment Anything
  # на CPU, образ ~2 ГБ, память ~1,5 ГБ, ответ 5–15 с. Наружу не публикуется — к нему ходит бэкенд.
  segmenter:
    build: ./infra/segmenter
    image: collector-forecast/segmenter:local
    profiles: ["ai"]
    environment:
      SATELLITE_TILES: ${MAP_SATELLITE_TILES:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
    volumes:
      - segmentercache:/data
    restart: unless-stopped

  # ---------- учебный контур (профиль training) ----------
  migrate-training:
    <<: *training
    command: ["sh", "-c", "python manage.py ensure_database && python manage.py migrate --noinput && python manage.py bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      # учётные записи берутся из базы основной системы — она должна быть готова
      migrate:
        condition: service_completed_successfully

  backend-training:
    <<: *training
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-training:
    # Воркер и планировщик в одном процессе: нагрузка учебного контура невелика
    <<: *training
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]

  consumer-training:
    <<: *training
    command: ["python", "manage.py", "consume_events", "--metrics-port", "9102"]
    depends_on:
      migrate-training:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  mock-helpdesk-training:
    image: collector-forecast/mock-helpdesk:local
    pull_policy: never
    profiles: ["training"]
    environment:
      STAGE_MINUTES: ${HELPDESK_STAGE_MINUTES:-2,5,20,10}
    volumes:
      - helpdeskdata-training:/data
    restart: unless-stopped

  # Симулятор датчиков: полевой контур, видит только Kafka; веб-интерфейс — только с этой машины
  simulator:
    build: ./simulator
    image: collector-forecast/simulator:local
    profiles: ["training"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${SIMULATOR_TOPIC:-smvu.training-events}
      SIM_CONTOUR: ${SIMULATOR_CONTOUR:-учебный контур}
      # Команды учебных заданий (восстановить объект, запустить сценарий) — через тот же брокер
      SIM_COMMANDS_TOPIC: sim.training-commands
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8095}:8095"
    networks: [field]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Caddy: TLS (самоподписанный локальный CA), SPA и reverse proxy к API/WS/Grafana
    build: ./frontend
    image: collector-forecast/web:local
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # прежний адрес учебного контура: перенаправляет в /training/
      - "${TRAINING_PORT:-8443}:8443"
    # Адреса сайта, сертификат и сервер тайлов — из .env (подставляются в Caddyfile)
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost, 127.0.0.1}
      TRAINING_ADDRESS: ${TRAINING_ADDRESS:-localhost:8443, 127.0.0.1:8443}
      TLS: ${TLS:-internal}
      MAP_TILES_ORIGIN: ${MAP_TILES_ORIGIN:-https://tiles.versatiles.org}
      MAP_SATELLITE_ORIGIN: ${MAP_SATELLITE_ORIGIN:-https://server.arcgisonline.com}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/certs:/certs:ro
      - caddydata:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------- наблюдаемость ----------
  # Prometheus и Grafana открываются из меню системы: Caddy пускает только после проверки учётной записи
  # и роли (forward_auth → apps/accounts/observability.py); Prometheus — только администратору
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.external-url=/prometheus/
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      # Вход через учётную запись системы: Caddy передаёт X-WEBAUTH-* после проверки роли,
      # отдельных паролей и формы входа нет. Роль в Grafana (Admin / Viewer) обновляется каждую минуту
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Name:X-WEBAUTH-NAME Email:X-WEBAUTH-EMAIL Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_SYNC_TTL: "1"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: /
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB}
      # в TimescaleDB Grafana ходит ролью только для чтения, а не владельцем базы
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

  # Права папок Grafana: «Система» — только администратору, аналитик видит «Аналитику» (идемпотентно)
  grafana-init:
    <<: *backend
    command: ["python", "manage.py", "grafana_setup"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      grafana:
        condition: service_started

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on: [db]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]
    restart: unless-stopped

  celery-exporter:
    image: danihodovic/celery-exporter:0.12.2
    command: ["--broker-url=redis://redis:6379/0"]
    depends_on: [redis]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx256m"
    # Kafka UI без входа читает и пишет в темы (можно подмешать события датчиков) — только с этой машины;
    # удалённо — через SSH-туннель
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- надёжность ----------
  backup:
    # Автоматическое резервное копирование (ТЗ §11): ежедневный pg_dump с ротацией
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      POSTGRES_EXTRA_OPTS: "-Z6 --no-owner"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Полевой контур: симулятор и (в эксплуатации) шлюз СМВУ; из платформы сюда виден только брокер
  field:

volumes:
  pgdata:
  helpdeskdata:
  helpdeskdata-training:
  trainingartifacts:
  trainingmedia:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
  caddydata:
  media:
  segmentercache:
